name: Release

on:
  push:
    tags: ['*']

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: dist/build

      - name: Setup Java # https://github.com/actions/setup-java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Setup Node.js # https://github.com/actions/setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14
      - name: Setup PHP # https://github.com/shivammathur/setup-php
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: 8.4
          extensions: gmp
          tools: composer:v2
      - name: Build backend
        run: |
          cd dist/build/backend
          composer install --no-dev --optimize-autoloader --no-interaction
          bin/doctrine orm:generate-proxies
          composer openapi
        env:
          NEUCORE_APP_ENV: prod
          NEUCORE_DATABASE_URL: 'mysql://user:@127.0.0.1/db'
      - name: Generate OpenAPI client
        run: |
          cd dist/build/frontend
          ./openapi.sh
      - name: Build OpenAPI client
        run: |
          cd dist/build/frontend/neucore-js-client
          npm install --ignore-scripts
          npm run build
      - name: Build frontend
        run: |
          cd dist/build/frontend
          npm ci
          npm run postinstall
          npm run build

      - name: Get the version
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
      - name: Create archive
        run: |
          dist/build/setup/dist-collect-files.sh
          cd dist
          tar -czf neucore-${{ env.RELEASE_VERSION }}.tar.gz neucore
          sha256sum neucore-${{ env.RELEASE_VERSION }}.tar.gz > neucore-${{ env.RELEASE_VERSION }}.sha256
      - name: GitHub Release # https://github.com/softprops/action-gh-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/neucore-${{ env.RELEASE_VERSION }}.tar.gz
            dist/neucore-${{ env.RELEASE_VERSION }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU # https://github.com/docker/setup-qemu-action
        if: ${{ github.repository_owner == 'tkhamez' }}
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - name: Set up Docker Buildx # https://github.com/docker/setup-buildx-action
        if: ${{ github.repository_owner == 'tkhamez' }}
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build and publish Docker image
        if: ${{ github.repository_owner == 'tkhamez' }}
        run: |
          echo ${{ secrets.DOCKERHUB_PASSWORD }} | docker login -u tkhamez --password-stdin
          docker buildx build --platform linux/amd64,linux/arm64 -f dist/build/setup/Dockerfile --no-cache -t tkhamez/neucore:${{ env.RELEASE_VERSION }} -t tkhamez/neucore:latest --push dist
          docker logout
